# TMAP pedestrian routes (SK open API). Route calculation only.
#   nemo-deepagents itda-hack policy add --from-file policy/presets/itda-tmap.yaml --dry-run
preset:
  name: itda-tmap
  description: "TMAP: pedestrian route (POST) and POI search for coordinates (GET) only"
network_policies:
  itda_tmap:
    name: itda-tmap
    endpoints:
      - host: apis.openapi.sk.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/tmap/routes/pedestrian" }
          - allow: { method: GET, path: "/tmap/pois" }
    binaries:
      - { path: /opt/venv/bin/python3 }
      - { path: /opt/venv/bin/python }
