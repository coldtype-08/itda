# ItDA collection tool egress. Preview, then apply:
#   nemo-deepagents itda-hack policy add --from-file policy/presets/itda-tourapi.yaml --dry-run
preset:
  name: itda-tourapi
  description: "data.go.kr: KTO tourism/barrier-free (B551011), KMA (1360000), TAGO bus (1613000), accessibility facilities (B554287) only"
network_policies:
  itda_tourapi:
    name: itda-tourapi
    endpoints:
      - host: apis.data.go.kr
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/B551011/**" }
          - allow: { method: GET, path: "/1360000/**" }
          - allow: { method: GET, path: "/1613000/**" }
          - allow: { method: GET, path: "/B554287/**" }
    binaries:
      - { path: /opt/venv/bin/python3 }
      - { path: /opt/venv/bin/python }
