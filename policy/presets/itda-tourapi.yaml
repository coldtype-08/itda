# ItDA collection tool egress. Preview, then apply:
#   nemo-deepagents itda-hack policy add --from-file policy/presets/itda-tourapi.yaml --dry-run
preset:
  name: itda-tourapi
  description: "data.go.kr: Korea Tourism Organization (B551011) and KMA (1360000) paths only"
network_policies:
  itda_tourapi:
    name: itda-tourapi
    endpoints:
      - host: apis.data.go.kr
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/B551011/**" }
          - allow: { method: GET, path: "/1360000/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.12 }
      - { path: /usr/local/bin/python3 }
